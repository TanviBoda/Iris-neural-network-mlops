
name: Python CI and ML Pipeline

on:
  push:
    branches: [master]
    paths:
      - "iris.csv"
      - "iris.csv.dvc"
      - "neural_network.py"
      - "dvc.yaml"
      - "dvc.lock"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall -q app.py monitoring.py monitoring_report.py drift_detection.py evaluate_model.py neural_network.py

  train-model:
    runs-on: ubuntu-latest
    needs: syntax-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dvc==3.67.1"

      - name: Train neural network
  run: python neural_network.py
